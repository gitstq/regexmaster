[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regexmaster"
version = "1.0.0"
description = "A powerful terminal-based regex testing and debugging tool with AI-powered explanations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SOLO Agent", email = "solo-agent@example.com"}
]
keywords = ["regex", "terminal", "tui", "debugger", "ai", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.47.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
regexmaster = "regexmaster.cli:main"
rxm = "regexmaster.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/regexmaster"
Documentation = "https://github.com/gitstq/regexmaster#readme"
Repository = "https://github.com/gitstq/regexmaster"
Issues = "https://github.com/gitstq/regexmaster/issues"

[tool.hatch.build.targets.wheel]
packages = ["regexmaster"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
